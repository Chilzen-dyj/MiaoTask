name: Build Windows portable release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-windows.lock
      - name: Audit public source files
        run: python scripts/check_public_files.py
      - name: Install locked build environment
        run: python -m pip install -r requirements-windows.lock
      - name: Fetch official ADB runtime
        run: python scripts/fetch_platform_tools.py
      - name: Test, build, and verify the portable package
        run: python scripts/package_windows.py --adb-dir build/vendor/platform-tools
      - uses: actions/upload-artifact@v7
        with:
          name: MiaoTask-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: MiaoTask-windows-x64
          path: release-assets
      - name: Attach verified files to a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[A-Za-z0-9._-]+$') { throw 'Invalid tag name' }
          $existingRelease = & gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'A release already exists for this tag; retaining its reviewed assets.'
            exit 0
          }
          $releaseFiles = @(Get-ChildItem -LiteralPath release-assets -File | ForEach-Object { $_.FullName })
          & gh release create $env:RELEASE_TAG @releaseFiles --draft --generate-notes --title "MiaoTask $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
