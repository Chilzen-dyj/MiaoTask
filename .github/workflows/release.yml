name: Build Windows portable release

on:
  workflow_dispatch:
  push:
    tags:
      - 'MiaoTask-v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-windows.lock
      - name: Verify tagged version and reviewed release notes
        if: github.event_name == 'push'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content -LiteralPath version.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne $version) { throw 'Tag must match version.json' }
          python scripts/release_notes.py $version --output "$env:RUNNER_TEMP/miao-release-notes.md"
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed release notes are required' }
      - name: Audit public source files
        run: python scripts/check_public_files.py
      - name: Install locked build environment
        run: python -m pip install -r requirements-windows.lock
      - name: Fetch official ADB runtime
        run: python scripts/fetch_platform_tools.py
      - name: Test, build, and verify the portable package
        run: python scripts/package_windows.py --adb-dir build/vendor/platform-tools
      - uses: actions/upload-artifact@v7
        with:
          name: MiaoTask-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/MiaoTask-v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v7
        with:
          name: MiaoTask-windows-x64
          path: release-assets
      - name: Attach verified files to a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^MiaoTask-v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid tag name' }
          $existingRelease = & gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'A release already exists for this tag; retaining its reviewed assets.'
            exit 0
          }
          $releaseFiles = @(Get-ChildItem -LiteralPath release-assets -File | ForEach-Object { $_.FullName })
          $notesFile = "$env:RUNNER_TEMP/miao-release-notes.md"
          python scripts/release_notes.py $env:RELEASE_TAG --output $notesFile
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed release notes are required' }
          & gh release create $env:RELEASE_TAG @releaseFiles --draft --notes-file $notesFile --title ($env:RELEASE_TAG -replace '^MiaoTask-', 'MiaoTask ')
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
